services:
  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:///temelli.db
  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    volumes: [".:/app"]
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports: ["3000:3000"]
